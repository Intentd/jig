name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    uses: ./.github/workflows/build-and-publish.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  examples:
    uses: ./.github/workflows/package-examples.yml