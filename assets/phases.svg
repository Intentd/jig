<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="A jig run: the environment, the prepare steps in order, the expectations after the environment, after a step or after prepare, then the report, always written">
  <style>
    .box { fill: #F5F8FE; stroke: #326CE5; stroke-width: 1.5; }
    .final { fill: #326CE5; stroke: #326CE5; stroke-width: 1.5; }
    .title { fill: #14213D; font: 700 12px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; letter-spacing: 1.2px; }
    .final-title { fill: #FFFFFF; font: 700 12px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; letter-spacing: 1.2px; }
    .code { fill: #14213D; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .final-code { fill: #FFFFFF; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { fill: #5B6475; font: 11px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .final-note { fill: #DCE6FB; font: 11px ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .cmd { fill: #326CE5; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { fill: none; stroke: #326CE5; stroke-width: 2; }
    .back { fill: none; stroke: #326CE5; stroke-width: 2; stroke-dasharray: 5 5; }
    .head { fill: #326CE5; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #16213A; stroke: #6E9BF5; }
      .final { fill: #2D5BC4; stroke: #6E9BF5; }
      .title, .code { fill: #F0F3F6; }
      .note { fill: #A3ACBA; }
      .cmd { fill: #8FB2F7; }
      .arrow, .back { stroke: #6E9BF5; }
      .head { fill: #6E9BF5; }
    }
  </style>

  <!-- 1. Environment -->
  <rect class="box" x="20" y="40" width="150" height="100" rx="10"/>
  <text class="title" x="36" y="66">ENVIRONMENT</text>
  <text class="code" x="36" y="90">cluster</text>
  <text class="code" x="36" y="108">images</text>
  <text class="note" x="36" y="128">apply · helm · wait</text>

  <!-- 2. Prepare -->
  <rect class="box" x="200" y="40" width="150" height="100" rx="10"/>
  <text class="title" x="216" y="66">PREPARE</text>
  <text class="code" x="216" y="90">1 chart</text>
  <text class="code" x="216" y="108">2 order</text>
  <text class="note" x="216" y="128">steps, in order</text>

  <!-- 3. Assert -->
  <rect class="box" x="380" y="40" width="150" height="100" rx="10"/>
  <text class="title" x="396" y="66">ASSERT</text>
  <text class="code" x="396" y="90">expect</text>
  <text class="note" x="396" y="110">polls until it passes</text>
  <text class="note" x="396" y="128">or times out</text>

  <!-- 4. Report -->
  <rect class="final" x="560" y="40" width="140" height="100" rx="10"/>
  <text class="final-title" x="576" y="66">REPORT</text>
  <text class="final-code" x="576" y="90">markdown</text>
  <text class="final-code" x="576" y="108">json</text>
  <text class="final-note" x="576" y="128">always written</text>

  <!-- flow -->
  <path class="arrow" d="M170 90 H192"/>
  <polygon class="head" points="198,90 188,84 188,96"/>
  <path class="arrow" d="M350 90 H372"/>
  <polygon class="head" points="378,90 368,84 368,96"/>
  <path class="arrow" d="M530 90 H552"/>
  <polygon class="head" points="558,90 548,84 548,96"/>

  <!-- after: the expectations run after the environment, after a step, or after prepare -->
  <text class="cmd" x="365" y="22" text-anchor="middle">after: environment · a step · prepare</text>
  <path class="back" d="M455 144 C455 196 95 196 95 146"/>
  <polygon class="head" points="95,142 89,154 101,154"/>
  <path class="back" d="M455 144 C455 180 275 180 275 146"/>
  <polygon class="head" points="275,142 269,154 281,154"/>
  <text class="note" x="365" y="218" text-anchor="middle">each step runs, then the expectations that name it</text>
</svg>
